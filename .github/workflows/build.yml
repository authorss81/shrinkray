name: build

# Builds what a user can install: a debug-signed APK and a Windows release
# bundle, on every push. Asserts each artefact actually contains the native
# engine rather than trusting that the build printed "Built".
#
# Signed releases are cut by hand. See the PixelSmith phase-16 prompt for the
# signing checklist.
#
# The slow parts live here, not on a developer machine: the Android SDK setup,
# the Flutter SDK download, cargo-ndk, and both release builds.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The engine is a separate repository. Pinned by SHA so a PixelSmith commit
  # can never silently change what this build links.
  ENGINE_REF: main
  ENGINE_REPO: authorss81/pixelsmith

jobs:
  # ---------------------------------------------------------------------------
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Check out the engine
        uses: actions/checkout@v5
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          path: engine

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The runner image already ships an Android SDK, but `sdkmanager` is not
      # on PATH — it lives under $ANDROID_SDK_ROOT/cmdline-tools. Using the bare
      # name fails with "command not found".
      - name: Accept Android SDK licences
        run: |
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          # armeabi-v7a is in this list because Flutter packages libflutter.so
          # for it by default. Without an engine .so for the same ABI, the app
          # loads on a 32-bit device and then fails at the first DynamicLibrary
          # lookup -- so the ABI sets have to match exactly.
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - uses: subosito/flutter-action@v2
        with:
          # channel alone resolves the latest stable. Passing
          # flutter-version: stable alongside it breaks version resolution
          # ("Unable to determine Flutter version").
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build the Rust library for Android ABIs
        run: |
          # cargo-ndk supplies the NDK clang wrapper that plain
          # `cargo build --target` lacks.
          mkdir -p android/app/src/main/jniLibs
          ( cd engine/core && cargo ndk \
              -t arm64-v8a -t armeabi-v7a -t x86_64 \
              -o "$OLDPWD/android/app/src/main/jniLibs" \
              build --release --lib )
          find android/app/src/main/jniLibs -name '*.so'

      - name: Build the APK
        # --release, not --debug. A debug APK carries
        # libVkLayer_khronos_validation.so (15 MB) and a JIT-mode Dart snapshot,
        # which is why the previous artifact was 160 MB and mostly not the app.
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shrinkray-apk
          path: build/app/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify the APK is a real, installable archive
        run: |
          APK=$(find build/app/outputs -name '*.apk' ! -name '*debug*' | head -n1)
          if [ -z "${APK}" ]; then
            echo "::error::no release APK produced"
            find build/app/outputs -name '*.apk' || true
            exit 1
          fi
          echo "APK: ${APK} ($(stat -c%s "${APK}") bytes)"
          unzip -l "${APK}" | tail -n 1
          # An APK without the native library opens fine and crashes on first
          # tap, which no build log will ever tell you about.
          unzip -l "${APK}" | grep -q 'classes.dex' \
            || { echo "::error::APK has no classes.dex - this is not an app"; exit 1; }

          # Per-ABI completeness. Flutter ships libflutter.so for every ABI it
          # supports; the engine has to be there for each one too. Checking only
          # that *some* ABI has the engine is how the previous build passed while
          # armeabi-v7a had libflutter.so and no engine at all - a 32-bit device
          # would install the app and crash on first resize.
          echo "--- native libraries ---"
          unzip -l "${APK}" | grep -E 'lib/[^/]+/.*\.so$' | awk '{printf "  %-52s %10d bytes\n", $4, $1}'

          FLUTTER_ABIS=$(unzip -l "${APK}" | grep -oE 'lib/[^/]+/libflutter\.so' | cut -d/ -f2 | sort -u)
          ENGINE_ABIS=$(unzip -l "${APK}" | grep -oE 'lib/[^/]+/libpixelsmith_core\.so' | cut -d/ -f2 | sort -u)
          echo "flutter ABIs: ${FLUTTER_ABIS}"
          echo "engine  ABIs: ${ENGINE_ABIS}"

          if [ -z "${ENGINE_ABIS}" ]; then
            echo "::error::APK has no libpixelsmith_core.so at all"
            exit 1
          fi
          MISSING=""
          for abi in ${FLUTTER_ABIS}; do
            echo "${ENGINE_ABIS}" | grep -qx "${abi}" || MISSING="${MISSING} ${abi}"
          done
          if [ -n "${MISSING}" ]; then
            echo "::error::these ABIs ship libflutter.so but no libpixelsmith_core.so:${MISSING}"
            echo "::error::those devices would install the app and crash on first resize"
            exit 1
          fi
          echo "OK: engine present for every ABI: ${ENGINE_ABIS}"

          # A debug APK drags in the Vulkan validation layer. Its presence means
          # --debug slipped back in and the artifact is not what we ship.
          if unzip -l "${APK}" | grep -q 'libVkLayer_khronos_validation\.so'; then
            echo "::error::APK contains the Vulkan validation layer - this is a debug build"
            exit 1
          fi
          echo "OK: no debug-only native libraries"

  # ---------------------------------------------------------------------------
  windows-exe:
    name: Windows EXE
    # Must run on Windows: the Flutter desktop toolchain is MSBuild-based and
    # will not cross-compile from Linux.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Check out the engine
        uses: actions/checkout@v5
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          path: engine

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          # channel alone resolves the latest stable. Passing
          # flutter-version: stable alongside it breaks version resolution
          # ("Unable to determine Flutter version").
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build the Rust library for Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows\runner | Out-Null
          Push-Location engine\core
          cargo build --release --lib
          Pop-Location
          Copy-Item engine\core\target\release\pixelsmith_core.dll windows\runner\

      - name: Build the EXE
        run: flutter build windows --release

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          # The whole Release directory, not a bare EXE: an EXE without its
          # DLLs does not start.
          name: shrinkray-windows
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 30

      - name: Verify the EXE and its native library
        shell: pwsh
        run: |
          # Look ONLY under runner/Release. A recursive search across
          # build/windows catches CMake's compiler-detection stub
          # (CMakeFiles/.../CompilerIdCXX.exe, 15 KB), which reads as an
          # "implausibly small" app when it is not the app at all.
          $release = Join-Path (Get-Location) 'build\windows\x64\runner\Release'
          if (-not (Test-Path $release)) {
            Write-Output "::error::no Release bundle at $release — flutter build windows produced nothing"
            exit 1
          }
          $exe = Join-Path $release 'shrinkray.exe'
          if (-not (Test-Path $exe)) {
            Write-Output "::error::no shrinkray.exe in $release"
            Get-ChildItem $release -Filter '*.exe' | ForEach-Object { Write-Output "  found: $($_.Name)" }
            exit 1
          }
          # A Flutter release EXE is legitimately small (~90 KB): the Dart AOT
          # snapshot ships separately as data/app.so. Only a floor is
          # meaningful here, to catch a truncated or stub binary.
          $exeSize = (Get-Item $exe).Length
          Write-Output "EXE: $exe ($exeSize bytes)"
          if ($exeSize -lt 40kb) {
            Write-Output "::error::EXE is $exeSize bytes - truncated or not a real Flutter binary"
            exit 1
          }
          # Prove it is a real Flutter bundle rather than a bare executable.
          if (-not (Test-Path (Join-Path $release 'data\flutter_assets'))) {
            Write-Output '::error::data/flutter_assets missing - this is not a Flutter bundle'
            exit 1
          }
          # The engine must ship inside the bundle. A missing DLL means the app
          # opens fine and then throws on the first resize, so this is the check
          # that actually matters.
          $dll = Join-Path $release 'pixelsmith_core.dll'
          if (-not (Test-Path $dll)) {
            Write-Output '::error::pixelsmith_core.dll is not in the bundle - the app would crash on first resize'
            Write-Output 'listing:'
            Get-ChildItem $release -Recurse -Filter '*.dll' | ForEach-Object { Write-Output "  $($_.FullName)" }
            exit 1
          }
          Write-Output "OK: engine DLL at $dll ($((Get-Item $dll).Length) bytes)"
          $total = (Get-ChildItem $release -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Output "OK: bundle total $([math]::Round($total / 1MB, 1)) MB"
